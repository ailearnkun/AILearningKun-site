[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "26"

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    # Everything is first-party: self-hosted font, own CSS/JS, no CDN.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# HTML should always be revalidated so content edits go live immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# CMS admin (/admin) — relaxed CSP.
# Decap CMS loads its bundle from unpkg, talks to Netlify Identity and the
# GitHub API, and compiles its YAML config with eval() — so it needs
# 'unsafe-eval' in script-src. This rule is intentionally scoped to /admin
# so the public site keeps the strict first-party-only policy.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://api.github.com https://raw.githubusercontent.com https://unpkg.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"

# Long cache for static assets
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long cache for fingerprinted-by-convention static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Redirects: keep the old single-page URL working
# ---------------------------------------------------------------------------

# NOTE on Netlify Identity invite links:
# The invite/recovery/confirmation tokens live in the URL *fragment*
# (https://ailearnkun.my.id/#invite_token=...). The fragment is never sent to
# the server, so a netlify.toml redirect CANNOT see it. The token is therefore
# handled client-side: a tiny script in the base layout detects an identity
# token in the hash and forwards the browser to /admin (where the Decap /
# identity widget consumes it). See the identity-redirect snippet in
# src/_includes/layouts/base.njk.
